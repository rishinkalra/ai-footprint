name: Release

# Publishes a GitHub Release with ready-to-install zips. Either:
#   - Actions > Release > Run workflow, and enter a version such as v0.2.0, or
#   - push a tag like v0.2.0, or create the release on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          (cd dashboard && npm ci && npm test)
          (cd extension && npm test)
      - name: Build
        working-directory: extension
        run: |
          npm run build
          npx -y addons-linter dist/firefox
          cd dist
          mv ai-footprint-chrome-*.zip "AI-Footprint-${VERSION}-Chrome-Edge-Brave.zip"
          mv ai-footprint-firefox-*.zip "AI-Footprint-${VERSION}-Firefox.zip"
          rm -f ai-footprint-safari-*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          **Chrome, Edge, Brave, Arc, Opera, Vivaldi**
          1. Download **AI-Footprint-…-Chrome-Edge-Brave.zip** below and unzip it.
          2. Open `chrome://extensions` (Edge: `edge://extensions`) and turn on **Developer mode**.
          3. Click **Load unpacked** and choose the unzipped folder.

          **Firefox:** download **AI-Footprint-…-Firefox.zip**, then open `about:debugging#/runtime/this-firefox`, click **Load Temporary Add-on…** and choose the zip.

          **Safari (Mac):** see the Safari section of [extension/README.md](https://github.com/${{ github.repository }}/blob/main/extension/README.md#develop).

          Store listings, with one-click install, are coming. Everything stays on your device; see [PRIVACY](https://github.com/${{ github.repository }}/blob/main/extension/PRIVACY.md).
          NOTES
          # Creates the tag and release, or updates a release made on the Releases page.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" extension/dist/*.zip --clobber
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" extension/dist/*.zip --target "$GITHUB_SHA" --title "AI Footprint $VERSION" --notes-file notes.md
          fi
