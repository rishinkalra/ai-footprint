<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Footprint</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="pop">
    <header class="top">
      <a class="logo" href="welcome.html" target="_blank" id="logo"><span class="mark" id="mark"></span>AI Footprint</a>
      <div class="seg" role="group" aria-label="Period" data-i18n-label="aria_period" id="rangeSeg">
        <button type="button" data-range="today" data-i18n="range_today">Today</button>
        <button type="button" data-range="7d" aria-pressed="true" data-i18n="range_7d">7 days</button>
        <button type="button" data-range="30d" data-i18n="range_30d">30 days</button>
      </div>
    </header>

    <section class="access" id="access" hidden>
      <p data-i18n="access_popup">Allow access to your AI sites so replies can be measured.</p>
      <button type="button" class="btn primary" id="allow" data-i18n="access_allow">Allow</button>
    </section>
    <section class="card hero" id="hero" aria-live="polite"></section>
    <section class="card stats" id="stats"></section>
    <section class="card chart" id="chart"></section>
    <section class="card apps" id="apps"></section>
    <section class="card tips" id="tips"></section>

    <footer class="foot">
      <span class="private" id="private"></span>
      <span class="actions">
        <a class="btn quiet" href="share.html" target="_blank" id="shareLink"></a>
        <a class="btn quiet" href="options.html" target="_blank" id="settingsLink"></a>
      </span>
    </footer>
  </main>
  <script src="core.js"></script>
  <script src="sites.js"></script>
  <script src="regions-data.js"></script>
  <script src="regions.js"></script>
  <script src="store.js"></script>
  <script src="format.js"></script>
  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/hi.js"></script>
  <script src="locales/es.js"></script>
  <script src="compare.js"></script>
  <script src="dom.js"></script>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
