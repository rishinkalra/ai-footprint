<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI footprint</title>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <h1>⚡ AI footprint</h1>
      <div class="seg" role="group" aria-label="Period" id="rangeSeg">
        <button data-range="today">Today</button>
        <button data-range="7d" aria-pressed="true">7 days</button>
        <button data-range="30d">30 days</button>
      </div>
    </header>

    <section class="card goal" id="goal"></section>
    <section class="tiles" id="tiles"></section>
    <p class="trend" id="trend"></p>

    <section class="card">
      <h2>By app</h2>
      <div id="sites"></div>
    </section>

    <section class="card" id="insightsCard">
      <h2>Lower your footprint</h2>
      <ul id="insights"></ul>
    </section>

    <footer>
      <a href="options.html" target="_blank" id="settingsLink">Settings &amp; how we estimate</a>
      <span class="muted">Estimates · stays on this device</span>
    </footer>
  </main>
  <script src="core.js"></script>
  <script src="sites.js"></script>
  <script src="store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
